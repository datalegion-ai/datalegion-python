name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a release mid-publish
  cancel-in-progress: false

jobs:
  lint:
    name: Lint & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # main only takes pull requests, so the release PR bumps the version and the tag must match it.
      - name: Check the tag matches pyproject.toml
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"${VERSION}\"" pyproject.toml || {
            echo "::error::pyproject.toml is not version ${VERSION}; bump it in a PR before tagging"
            exit 1
          }

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install  # .python-version, the 3.11 floor

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run lint
        run: uv run python scripts/lint.py

      - name: Build
        run: uv build

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Without this uv takes the interpreter from .python-version (the 3.11 floor), and
    # every leg ran the floor while its name said otherwise (seen on main, 2026-09-25).
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.x"
          enable-cache: true
          # Matrix legs share one cache key otherwise and race to save it ("Unable to reserve cache").
          cache-suffix: py${{ matrix.python-version }}
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Check the interpreter is the matrix version
        run: uv run python -c "import sys; v = '%d.%d' % sys.version_info[:2]; assert v == '${{ matrix.python-version }}', f'ran {sys.version}, matrix says ${{ matrix.python-version }}'; print(sys.version)"

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        env:
          DATALEGION_API_KEY: ${{ secrets.DATALEGION_API_KEY }}

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  publish-pypi:
    name: Publish to PyPI
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.x"

      - name: Set up Python
        run: uv python install  # .python-version, the 3.11 floor

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  github-release:
    name: Create GitHub Release
    needs: [publish-pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
