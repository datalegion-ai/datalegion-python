name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  security:
    name: Security scan
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.x"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"

      # Scanners run via uvx rather than `pip install`, which leaves the runner's
      # system packaging (/usr/lib/python3/dist-packages) ahead of the tool's own
      # on sys.path, the shadowing that broke a release when
      # twine 7.0.0 shipped. Left unpinned so they pick up current rules/advisories.
      - name: Run Bandit (SAST)
        run: |
          uvx bandit -r src/ \
            --severity-level high \
            --confidence-level high

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          uv export --format requirements-txt --no-hashes > requirements.txt
          uvx pip-audit -r requirements.txt --disable-pip --no-deps

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned and checksum-verified (the upgrade sweep moves the version and both digests).
      # actionlint runs shellcheck on every `run:` script when shellcheck is on PATH, so
      # install it rather than let those checks skip silently.
      - name: Lint workflows (actionlint + shellcheck)
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64; sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            aarch64) arch=arm64; sha=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          f="actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz"
          curl -fsSL -o "/tmp/$f" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "$sha  /tmp/$f" | sha256sum -c -
          tar -xzf "/tmp/$f" -C /tmp actionlint
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          /tmp/actionlint -color
      - name: Check workflow names use sentence case
        run: python3 .github/scripts/check_workflow_names.py

  zizmor:
    name: Audit workflows (zizmor)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fleet rule (datalegion-infra docs/devops-baseline.md): every action pinned to a commit SHA, no persisted
      # checkout token, no cache in release jobs, permissions per job. zizmor fails the job on any finding; its
      # online audits also flag known-vulnerable actions, which Dependabot does not alert on for SHA pins.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: "1.33.1"
          advanced-security: "false"
          strict-collection: "true"
